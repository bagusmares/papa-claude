function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function open(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var out=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},key,u(D));
  return new TextDecoder().decode(out);
}

};
